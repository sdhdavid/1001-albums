name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp asset URLs with the commit so browsers never mix old and new files.
      - name: Version asset URLs
        run: |
          v=${GITHUB_SHA::8}
          sed -i "s#\./styles\.css\"#./styles.css?v=$v\"#; s#\./app\.js\"#./app.js?v=$v\"#" dist/index.html
          sed -i "s#\./styles\.css\"#./styles.css?v=$v\"#; s#\./app\.js\"#./app.js?v=$v\"#; s#\./en\.css\"#./en.css?v=$v\"#" dist/en/index.html
          sed -i "s#^const V = .*#const V = '?v=$v';#" dist/app.js
          grep -c "?v=$v" dist/index.html dist/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
