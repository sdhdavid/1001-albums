name: Fetch track durations

# Run by hand (Actions tab → Run workflow) after adding albums. The job log
# prints a JSON map of track lengths between DURATIONS markers; check each
# album's total against guide.book.duration before merging it into pilot.json.
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_durations.py
