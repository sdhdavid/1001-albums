name: Fetch track durations

# Run by hand (Actions tab → Run workflow) after adding albums. The job log
# prints a JSON map of track lengths between DURATIONS markers; check each
# album's total against guide.book.duration before merging it with tools/merge_durations.py.
on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch file to look up (e.g. tools/batches/51-52.json). Empty = every album on the site.'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_durations.py ${{ inputs.batch }}
